<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Igor Labs - Voice Assistant</title>
    <style>
        body {
            background-color: #050b14;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.3rem;
            margin: 5px 0;
            text-align: center;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
        }
        #unlock-btn {
            background: #38bdf8;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }
        #chat-container {
            width: 100%;
            max-width: 550px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 60vh;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .user-msg {
            background: #0284c7;
            color: #fff;
            align-self: flex-end;
        }
        .bot-msg {
            background: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border: 1px solid #334155;
        }
        #controls {
            width: 100%;
            max-width: 550px;
            padding: 12px;
            background: #0b1329;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 8px;
            box-sizing: border-box;
        }
        input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #020617;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }
        input:focus { border-color: #38bdf8; }
        button.send-btn {
            padding: 10px 16px;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button.send-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

    <h1>Engine Igor Labs Animatronic</h1>
    <div class="subtitle">Device TTS Engine (Web Speech API)</div>

    <!-- Tombol aktivasi agar browser mengizinkan pemutaran suara device -->
    <button id="unlock-btn" onclick="initDeviceTTS()">🔊 AKTIFKAN SUARA DEVICE</button>

    <div id="chat-container">
        <div id="messages">
            <div class="msg bot-msg">Sistem siap. Klik tombol di atas sekali, lalu kirim pesan untuk mendengar suara dari device kamu.</div>
        </div>
        <div id="controls">
            <input type="text" id="userInput" placeholder="Ketik perintah..." onkeydown="if(event.key==='Enter') handleSend()">
            <button class="send-btn" onclick="handleSend()">Kirim</button>
        </div>
    </div>

    <script>
        let ttsReady = false;

        function initDeviceTTS() {
            if (!('speechSynthesis' in window)) {
                alert("Maaf, browser ini tidak mendukung TTS bawaan device.");
                return;
            }

            // Pancing engine TTS device dengan mengucapkan teks kosong / sapaan singkat
            let utterance = new SpeechSynthesisUtterance("Sistem suara device diaktifkan.");
            utterance.lang = 'id-ID';
            utterance.rate = 1.0;
            
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
            
            ttsReady = true;
            let btn = document.getElementById('unlock-btn');
            btn.style.background = '#10b981';
            btn.innerText = '✅ SUARA DEVICE AKTIF';
        }

        function speakDeviceTTS(text) {
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // Hentikan suara sebelumnya

            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID'; // Menggunakan suara bahasa Indonesia bawaan HP/Device
            utterance.rate = 1.0;     // Kecepatan normal
            utterance.pitch = 1.0;    // Nada suara

            // Coba ambil suara bahasa Indonesia yang tersedia di device
            let voices = window.speechSynthesis.getVoices();
            let indoVoice = voices.find(v => v.lang.includes('id') || v.lang.includes('ID') || v.name.toLowerCase().includes('indonesian'));
            if (indoVoice) {
                utterance.voice = indoVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function handleSend() {
            let input = document.getElementById('userInput');
            let txt = input.value.trim();
            if(!txt) return;

            let box = document.getElementById('messages');
            box.innerHTML += `<div class="msg user-msg">${txt}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            let reply = "Perintah " + txt + " diterima oleh sistem Engine Igor Labs.";

            setTimeout(() => {
                box.innerHTML += `<div class="msg bot-msg">${reply}</div>`;
                box.scrollTop = box.scrollHeight;

                // Jika belum klik tombol aktifkan, panggil otomatis
                if (!ttsReady) {
                    initDeviceTTS();
                }

                // Ucapkan menggunakan TTS bawaan device
                speakDeviceTTS(reply);
            }, 300);
        }

        // Preload daftar suara device
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
</body>
</html>
