<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Igor Labs - Cloud AI Voice Chat</title>
    <!-- Firebase SDK (Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #050b14;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.3rem;
            margin: 5px 0;
            text-align: center;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
        }
        #unlock-btn {
            background: #22c55e;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }
        #chat-container {
            width: 100%;
            max-width: 550px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 60vh;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .user-msg {
            background: #0284c7;
            color: #fff;
            align-self: flex-end;
        }
        .bot-msg {
            background: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border: 1px solid #334155;
        }
        #controls {
            width: 100%;
            max-width: 550px;
            padding: 12px;
            background: #0b1329;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 8px;
            box-sizing: border-box;
        }
        input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #020617;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }
        input:focus { border-color: #38bdf8; }
        button.send-btn {
            padding: 10px 16px;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button.send-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

    <h1>Engine Igor Labs Animatronic</h1>
    <div class="subtitle">Cloud Realtime Sync (Firebase Powered)</div>

    <button id="unlock-btn" onclick="initAudio()">🔊 KLIK SEKALI UNTUK AKTIFKAN SUARA</button>

    <div id="chat-container">
        <div id="messages">
            <div class="msg bot-msg">Menghubungkan ke Cloud Database...</div>
        </div>
        <div id="controls">
            <input type="text" id="userInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        // Konfigurasi Firebase Realtime Database (Gratis & Realtime)
        const firebaseConfig = {
            databaseURL: "https://servo-melody-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isAudioUnlocked = false;

        function initAudio() {
            if (!('speechSynthesis' in window)) return;
            let utterance = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(utterance);
            isAudioUnlocked = true;
            let btn = document.getElementById('unlock-btn');
            btn.style.background = '#10b981';
            btn.innerText = '✅ SUARA CLOUD AKTIF';
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 1.0;
            
            let voices = window.speechSynthesis.getVoices();
            let indoVoice = voices.find(v => v.lang.includes('id') || v.lang.includes('ID'));
            if (indoVoice) utterance.voice = indoVoice;

            window.speechSynthesis.speak(utterance);
        }

        // Pantau database secara real-time (jika ada pesan baru dari terminal/cloud, otomatis tampil & bersuara!)
        const messagesRef = db.ref('chat_messages');
        messagesRef.on('child_added', (snapshot) => {
            let data = snapshot.val();
            let box = document.getElementById('messages');
            
            // Hapus teks loading awal jika ada
            if(box.children.length === 1 && box.children[0].innerText.includes('Menghubungkan')) {
                box.innerHTML = '';
            }

            let msgClass = data.sender === 'user' ? 'user-msg' : 'bot-msg';
            box.innerHTML += `<div class="msg ${msgClass}">${escapeHtml(data.text)}</div>`;
            box.scrollTop = box.scrollHeight;

            // Jika pesan dari bot, otomatis putar suara di device!
            if (data.sender === 'bot') {
                if (!isAudioUnlocked) initAudio();
                speakText(data.text);
            }
        });

        function sendMessage() {
            let input = document.getElementById('userInput');
            let txt = input.value.trim();
            if (!txt) return;

            // Kirim pesan user ke Cloud Database
            messagesRef.push({
                sender: 'user',
                text: txt,
                timestamp: Date.now()
            });

            input.value = '';

            // Simulasi bot otomatis membalas via Cloud setelah 1 detik
            setTimeout(() => {
                let botReply = "Respon cloud untuk: " + txt;
                messagesRef.push({
                    sender: 'bot',
                    text: botReply,
                    timestamp: Date.now()
                });
            }, 800);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
</body>
</html>
