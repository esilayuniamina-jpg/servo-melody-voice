<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Igor Labs - Animatronic Voice</title>
    <!-- Memuat ResponsiveVoice JS secara sinkron di head agar siap dipakai -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=free"></script>
    <style>
        body {
            background-color: #050b14;
            color: #e2e8f0;
            font-family: monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 10px;
        }
        #terminal {
            width: 100%;
            max-width: 600px;
            background: #000;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            height: 60vh;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        .log {
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .user { color: #4ade80; }
        .bot { color: #38bdf8; }
        #audio-status {
            font-size: 0.8rem;
            color: #facc15;
            margin-top: 5px;
            text-align: center;
        }
        #input-box {
            width: 100%;
            max-width: 600px;
            display: flex;
            margin-top: 10px;
            gap: 5px;
        }
        input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            outline: none;
        }
        button {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>ENGINE IGOR LABS - VOICE TERMINAL</h1>
    <div id="audio-status">Klik tombol SEND atau tekan Enter untuk mengaktifkan suara.</div>

    <div id="terminal">
        <div class="log bot">> Sistem siap. Silakan kirim pesan.</div>
    </div>

    <div id="input-box">
        <input type="text" id="command" placeholder="Ketik perintah..." onkeydown="if(event.key==='Enter') kirim()">
        <button onclick="kirim()">SEND</button>
    </div>

    <script>
        // Fungsi untuk menguji dan memaksa inisialisasi audio konteks browser
        function unlockAudio() {
            if (typeof responsiveVoice !== 'undefined') {
                // Panggil silent/dummy speak untuk unlock policy browser
                try {
                    responsiveVoice.speak("", "Indonesian Female");
                } catch(e) {}
            }
        }

        function kirim() {
            // Unlock audio on user interaction
            unlockAudio();

            let input = document.getElementById('command');
            let text = input.value.trim();
            if(!text) return;

            let term = document.getElementById('terminal');
            
            // Tampilkan pesan user
            term.innerHTML += `<div class="log user">> ${text}</div>`;
            input.value = '';
            term.scrollTop = term.scrollHeight;

            // Respon bot
            let reply = "Perintah " + text + " berhasil diproses.";
            
            setTimeout(() => {
                term.innerHTML += `<div class="log bot">> ${reply}</div>`;
                term.scrollTop = term.scrollHeight;

                // Eksekusi Suara
                if (typeof responsiveVoice !== 'undefined') {
                    responsiveVoice.speak(reply, "Indonesian Female", {
                        rate: 1.0,
                        onstart: function() {
                            document.getElementById('audio-status').innerText = "Status: Memutar suara...";
                        },
                        onend: function() {
                            document.getElementById('audio-status').innerText = "Status: Selesai.";
                        }
                    });
                } else {
                    // Fallback jika responsivevoice gagal dimuat
                    let utterance = new SpeechSynthesisUtterance(reply);
                    utterance.lang = 'id-ID';
                    window.speechSynthesis.speak(utterance);
                }
            }, 200);
        }
    </script>
</body>
</html>
