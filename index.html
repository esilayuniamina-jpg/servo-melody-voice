<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Igor Labs Animatronic Puppet</title>
    <style>
        body {
            background-color: #050b14;
            color: #e2e8f0;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.2rem;
            text-align: center;
        }
        #terminal {
            width: 100%;
            max-width: 600px;
            background: #000;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            height: 65vh;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        .log {
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .user { color: #4ade80; }
        .bot { color: #38bdf8; }
        #input-box {
            width: 100%;
            max-width: 600px;
            display: flex;
            margin-top: 10px;
            gap: 5px;
        }
        input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            outline: none;
        }
        button {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>ENGINE IGOR LABS - TERMINAL VOICE</h1>

    <div id="terminal">
        <div class="log bot">> Sistem siap. Ketik pesan atau perintah...</div>
    </div>

    <div id="input-box">
        <input type="text" id="command" placeholder="Ketik perintah..." onkeydown="if(event.key==='Enter') kirim()">
        <button onclick="kirim()">SEND</button>
    </div>

    <script>
        // Menggunakan library responsivevoice.js (Versi lawas yang sangat stabil & terkenal langsung bunyi)
        let scriptTag = document.createElement('script');
        scriptTag.src = 'https://code.responsivevoice.org/responsivevoice.js?key=free';
        document.head.appendChild(scriptTag);

        function kirim() {
            let input = document.getElementById('command');
            let text = input.value.trim();
            if(!text) return;

            let term = document.getElementById('terminal');
            
            // Tampilkan pesan user
            term.innerHTML += `<div class="log user">> ${text}</div>`;
            input.value = '';
            term.scrollTop = term.scrollHeight;

            // Respon bot
            let reply = "Menjalankan perintah " + text + " sekarang.";
            setTimeout(() => {
                term.innerHTML += `<div class="log bot">> ${reply}</div>`;
                term.scrollTop = term.scrollHeight;

                // Panggil ResponsiveVoice (Versi lawas, sangat andal di HP & PC)
                if (typeof responsiveVoice !== 'undefined') {
                    responsiveVoice.speak(reply, "Indonesian Female", {rate: 1.0});
                } else {
                    // Fallback ke Google TTS API lama kalau responsivevoice belum load
                    let audio = new Audio("https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(reply) + "&tl=id&client=tw-ob");
                    audio.play().catch(e => console.log(e));
                }
            }, 300);
        }
    </script>
</body>
</html>
