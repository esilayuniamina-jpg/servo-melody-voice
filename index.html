<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Igor Labs - AI Voice Chat</title>
    <style>
        body {
            background-color: #050b14;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.3rem;
            margin: 5px 0;
            text-align: center;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
        }
        #unlock-btn {
            background: #22c55e;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }
        #chat-container {
            width: 100%;
            max-width: 550px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 60vh;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .user-msg {
            background: #0284c7;
            color: #fff;
            align-self: flex-end;
        }
        .bot-msg {
            background: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border: 1px solid #334155;
        }
        #controls {
            width: 100%;
            max-width: 550px;
            padding: 12px;
            background: #0b1329;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 8px;
            box-sizing: border-box;
        }
        input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #020617;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }
        input:focus { border-color: #38bdf8; }
        button.send-btn {
            padding: 10px 16px;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button.send-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

    <h1>Engine Igor Labs Animatronic</h1>
    <div class="subtitle">Auto-Voice AI Response (Device TTS)</div>

    <!-- Tombol aktivasi agar browser mengizinkan pemutaran suara otomatis -->
    <button id="unlock-btn" onclick="initAudio()">🔊 KLIK SEKALI UNTUK AKTIFKAN SUARA OTOMATIS</button>

    <div id="chat-container">
        <div id="messages">
            <div class="msg bot-msg">Halo! Setiap jawaban saya akan otomatis dibacakan oleh suara device kamu. Klik tombol hijau di atas dulu ya!</div>
        </div>
        <div id="controls">
            <input type="text" id="userInput" placeholder="Ketik pesan atau tanyakan sesuatu..." onkeydown="if(event.key==='Enter') handleSend()">
            <button class="send-btn" onclick="handleSend()">Kirim</button>
        </div>
    </div>

    <script>
        let isAudioUnlocked = false;

        function initAudio() {
            if (!('speechSynthesis' in window)) {
                alert("Browser tidak mendukung TTS device.");
                return;
            }

            // Pancing engine TTS device dengan mengucapkan teks kosong
            let utterance = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(utterance);
            
            isAudioUnlocked = true;
            let btn = document.getElementById('unlock-btn');
            btn.style.background = '#10b981';
            btn.innerText = '✅ SUARA OTOMATIS AKTIF';
        }

        // Fungsi untuk membacakan teks secara otomatis
        function speakResponse(text) {
            if (!('speechSynthesis' in window)) return;

            // Batalkan suara sebelumnya agar tidak bertumpuk
            window.speechSynthesis.cancel();

            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID'; // Bahasa Indonesia
            utterance.rate = 1.0;     // Kecepatan normal
            utterance.pitch = 1.0;    // Nada suara

            // Pilih suara Indonesia terbaik di device jika ada
            let voices = window.speechSynthesis.getVoices();
            let indoVoice = voices.find(v => v.lang.includes('id') || v.lang.includes('ID'));
            if (indoVoice) {
                utterance.voice = indoVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Simulasi kecerdasan respon bot AI
        function getBotReply(userText) {
            let text = userText.toLowerCase();
            
            if (text.includes('halo') || text.includes('hai')) {
                return "Halo juga! Ada yang bisa saya bantu terkait proyek servo melodi hari ini?";
            } else if (text.includes('servo') || text.includes('motor')) {
                return "Sistem pengendali servo di Engine Igor Labs siap dihubungkan ke mikrokontroler.";
            } else if (text.includes('melodi') || text.includes('musik') || text.includes('lagu')) {
                return "Modul melodi dirancang untuk menyelaraskan gerakan animatronic puppet dengan ritme audio.";
            } else if (text.includes('siapa kamu')) {
                return "Saya adalah asisten virtual cerdas untuk proyek Engine Igor Labs Animatronic Puppet.";
            } else {
                return "Perintah '" + userText + "' telah diterima dan diproses oleh sistem.";
            }
        }

        function handleSend() {
            let input = document.getElementById('userInput');
            let txt = input.value.trim();
            if(!txt) return;

            let box = document.getElementById('messages');
            
            // 1. Tampilkan pesan user di chat box
            box.innerHTML += `<div class="msg user-msg">${escapeHtml(txt)}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            // 2. Buat respon bot AI secara otomatis berdasarkan teks user
            let botReply = getBotReply(txt);

            setTimeout(() => {
                // Tampilkan respon bot di chat box
                box.innerHTML += `<div class="msg bot-msg">${escapeHtml(botReply)}</div>`;
                box.scrollTop = box.scrollHeight;

                // Jika user lupa klik tombol hijau, otomatis aktifkan
                if (!isAudioUnlocked) {
                    initAudio();
                }

                // 3. OTOMATIS UCAPKAN JAWABAN BOT DENGAN TTS DEVICE!
                speakResponse(botReply);
            }, 400);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Preload voices
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
</body>
</html>
